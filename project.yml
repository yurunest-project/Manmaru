name: Manmaru
options:
  bundleIdPrefix: com.manmaru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Release
packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Manmaru:
    type: application
    platform: iOS
    sources:
      - path: Manmaru
        excludes:
          - Resources/Info.plist
          - Resources/Manmaru.entitlements
    info:
      path: Manmaru/Resources/Info.plist
    entitlements:
      path: Manmaru/Resources/Manmaru.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manmaru.app
        PRODUCT_NAME: まんまる
        INFOPLIST_FILE: Manmaru/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Manmaru/Resources/Manmaru.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - sdk: AuthenticationServices.framework
      - sdk: MapKit.framework
      - sdk: CryptoKit.framework
