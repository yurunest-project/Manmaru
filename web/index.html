<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="description" content="ふたりの次のデートを、いちばん近くに。" />
    <meta name="theme-color" content="#E891A3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="まんまる" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <title>まんまる</title>
    <script>
      (function () {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        if (!isIOS || window.navigator.standalone) return;

        if (/Line\//i.test(ua)) {
          var url = new URL(location.href);
          if (url.searchParams.get("openExternalBrowser") === "1") return;
          url.searchParams.set("openExternalBrowser", "1");
          location.replace(url.toString());
          return;
        }

        if (/FBAN|FBAV/i.test(ua)) {
          location.replace("x-safari-" + location.href);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
